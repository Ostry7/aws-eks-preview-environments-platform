apiVersion: apps/v1
kind: Deployment
metadata:
  name:  main-devops-app
  namespace: test
  labels:
    app:  main-devops-app
spec:
  selector:
    matchLabels:
      app: main-devops-app
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  main-devops-app
    spec:
      containers:
      - name: main-devops-app
        image: ${IMAGE}
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_NAME
          valueFrom: { configMapKeyRef: { name: db-configmap, key: POSTGRES_DB } }
        - name: DB_USER
          valueFrom: { configMapKeyRef: { name: db-configmap, key: POSTGRES_USER } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
        - name: ENV
          value: test
        ports:
        - containerPort: 5000
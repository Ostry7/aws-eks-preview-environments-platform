apiVersion: apps/v1
kind: Deployment
metadata:
  name:  main-devops-app
  namespace: {{ .Values.namespace.name}}
  labels:
    app:  main-devops-app
spec:
  selector:
    matchLabels:
      app: main-devops-app
  replicas: {{ .Values.spec.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: {{ .Values.spec.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.spec.rollingUpdate.maxUnavailable }}
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  main-devops-app
    spec:
      containers:
      - name: main-devops-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_NAME
          valueFrom: { configMapKeyRef: { name: db-configmap, key: POSTGRES_DB } }
        - name: DB_USER
          valueFrom: { configMapKeyRef: { name: db-configmap, key: POSTGRES_USER } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
        - name: ENV
          value: test
        ports:
        - name: http
          containerPort: 5000
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-reaper
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-reaper
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: preview-reaper
---
# sekrety release'ów Helma leżą w namespace default
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-reaper-secrets
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-reaper-secrets
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-reaper-secrets
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: preview-reaper
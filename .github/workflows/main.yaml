name: Main pipeline with OIDC auth

on:
  workflow_dispatch: 
permissions: 
  id-token: write
  contents: read

jobs:
  run-some-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials for OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
      
      - name: Test AWS Creds
        run: aws sts get-caller-identity